# Configuration for the Intermittent Retail Demand Forecasting project.
#
# Every path and parameter the pipeline needs lives here, not hardcoded
# in the source files. This file grows as later phases are implemented
# (model hyperparameters, backtest settings, inventory assumptions) —
# Stage 1 (data layer), Stage 2 (demand classification), and Stage 3
# (EDA) are covered by the sections below. All three are part of the
# faculty's Phase 1 (synopsis preparation), not separate rubric phases.
#
# The `backtest` and `phase2` sections below are Phase 2 Step 2
# (evaluation/split framework + Seasonal Naive baseline).

data:
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed
  sales_file: sales_train_evaluation.csv
  calendar_file: calendar.csv
  prices_file: sell_prices.csv

scope:
  store_id: CA_1
  dept_id: FOODS_3

classification:
  adi_threshold: 1.32   # Syntetos-Boylan-Croston cutoff
  cv2_threshold: 0.49   # Syntetos-Boylan-Croston cutoff
  n_per_category: 5     # representative items to select per demand class
  random_seed: 42       # for reproducible representative selection

output:
  panel_filename: panel_ca1_foods3.parquet
  classification_filename: demand_classification.parquet
  selected_items_filename: selected_items.parquet
  aggregate_filename: aggregate_ca1_foods3.parquet
  selected_items_daily_sales_filename: selected_items_daily_sales.parquet

reports:
  phase1_dir: reports/phase1
  phase2_dir: reports/phase2
  phase3_dir: reports/phase3

backtest:
  holdout_days: 28    # final, untouched test set reserved from the tail of the series
  horizon: 28          # forecast horizon, every fold
  n_folds: 5            # rolling-origin folds during development-period comparison
  season_length: 7     # weekly seasonality for Seasonal Naive

# Phase 2 Step 5: classical model orders. Fixed candidates carried over
# from Step 4's ACF/PACF + auto_arima diagnostics -- this step fits and
# backtests them, it does not re-run an order search.
models:
  arima_order: [6, 1, 1]              # (p, d, q)
  sarima_order: [6, 1, 1]             # (p, d, q), same non-seasonal part as ARIMA
  sarima_seasonal_order: [0, 0, 2, 7] # (P, D, Q, m), m=7 weekly
  holt_winters_seasonal_periods: 7
  # Phase 2 Step 7: fixed, documented smoothing parameters for the first
  # Croston/TSB comparison -- literature-standard defaults (Croston 1972;
  # Teunter-Syntetos-Babai 2011), not tuned on any fold's forecast window.
  croston_alpha: 0.1   # smoothing weight, demand size and inter-demand interval
  tsb_alpha: 0.1        # smoothing weight, occurrence probability
  tsb_beta: 0.1          # smoothing weight, demand size (occurrence periods only)

phase2:
  forecasts_dir: artifacts/forecasts
  metrics_dir: artifacts/metrics
  seasonal_naive_forecasts_filename: seasonal_naive_backtest_forecasts.csv
  seasonal_naive_metrics_filename: seasonal_naive_backtest_metrics.csv
  seasonal_naive_plot_filename: seasonal_naive_forecast_vs_actual.png
  arima_forecasts_filename: arima_backtest_forecasts.csv
  arima_metrics_filename: arima_backtest_metrics.csv
  sarima_forecasts_filename: sarima_backtest_forecasts.csv
  sarima_metrics_filename: sarima_backtest_metrics.csv
  holt_winters_forecasts_filename: holt_winters_backtest_forecasts.csv
  holt_winters_metrics_filename: holt_winters_backtest_metrics.csv
  holt_winters_trend_comparison_filename: holt_winters_trend_comparison.csv
  model_comparison_metrics_filename: model_comparison_backtest_metrics.csv
  model_comparison_plot_filename: model_comparison_mae_rmse.png
  # Phase 2 Step 6 -- residual diagnostics and classical-model validation
  residual_fold_summary_filename: residual_diagnostics_fold_summary.csv
  residual_ljung_box_filename: residual_diagnostics_ljung_box.csv
  residual_diagnostics_plot_prefix: residual_diagnostics
  sarima_fold3_sensitivity_filename: sarima_fold3_convergence_sensitivity.csv
  holt_winters_trend_selection_caveat_filename: holt_winters_trend_selection_caveat.csv
  # Phase 2 Step 7 -- item-level Croston/TSB vs. per-item Seasonal Naive,
  # across the 20 selected items. Distinct filenames from the Step 2-6
  # keys above: those are the single CA_1/FOODS_3 AGGREGATE series,
  # these are per-item -- the two are never on the same error scale
  # (see notebook Section 12's explicit caveat).
  item_level_long_results_filename: item_level_backtest_long.csv
  item_level_fold_summary_filename: item_level_backtest_fold_summary.csv
  item_level_per_item_summary_filename: item_level_per_item_summary.csv
  item_level_category_summary_filename: item_level_category_macro_avg_summary.csv
  item_level_category_mae_plot_filename: item_level_category_mae_comparison.png
  item_level_category_rmse_plot_filename: item_level_category_rmse_comparison.png
  item_level_example_forecasts_plot_filename: item_level_example_forecasts.png

# Phase 3 Step 1 -- XGBoost on the 20 selected items. Fixed, documented
# first-baseline settings: nothing here was tuned on a fold's forecast
# window or on the final holdout, and no hyper-parameter search is run in
# this step. Feature definitions and their availability assumptions are
# documented in src/models/xgboost_model.py.
xgboost:
  lags: [1, 7, 14, 28]                 # sales at t-1, t-7, t-14, t-28
  rolling_mean_windows: [7, 14, 28]    # mean of t-w .. t-1 (the window ends the day BEFORE the target)
  use_event_calendar: true             # M5 events + SNAP (CA) + Christmas closure flag; sell_price is NOT used
  hyperparameters:
    objective: reg:squarederror        # primary model; count:poisson is a pre-declared secondary variant
    n_estimators: 300
    learning_rate: 0.05
    max_depth: 6
    min_child_weight: 1.0
    subsample: 0.8
    colsample_bytree: 0.8
    reg_lambda: 1.0
    random_state: 42
    n_jobs: 1                          # single thread: results do not depend on the machine's core count
    tree_method: hist

phase3:
  forecasts_dir: artifacts/forecasts
  metrics_dir: artifacts/metrics
  # Step 1 outputs. Distinct "xgboost_" names: the Phase 2 item_level_* files
  # above are completed results and are only ever read, never rewritten.
  xgboost_long_results_filename: xgboost_item_level_backtest_long.csv
  xgboost_fold_summary_filename: xgboost_item_level_fold_summary.csv
  xgboost_per_item_summary_filename: xgboost_item_level_per_item_summary.csv
  xgboost_category_summary_filename: xgboost_item_level_category_macro_avg_summary.csv
  xgboost_comparison_per_item_filename: xgboost_vs_baselines_per_item_summary.csv
  xgboost_comparison_category_filename: xgboost_vs_baselines_category_macro_avg_summary.csv
  xgboost_fold_diagnostics_filename: xgboost_fold_diagnostics.csv
  xgboost_fold_item_classes_filename: xgboost_fold_local_demand_classes.csv
  xgboost_feature_importance_filename: xgboost_feature_importance.csv
  xgboost_category_mae_plot_filename: xgboost_category_mae_comparison.png
  xgboost_category_rmse_plot_filename: xgboost_category_rmse_comparison.png
  xgboost_example_forecasts_plot_filename: xgboost_example_item_forecasts.png
  xgboost_feature_importance_plot_filename: xgboost_feature_importance.png

  # ---- Steps 2 onward: filenames only ADDED below; no key above is changed ----
  inventory_dir: artifacts/inventory
  final_dir: artifacts/final
  # Notebook 05 -- Seasonal Naive / Croston / TSB re-run on the 20 selected items,
  # plus a baselines-only robustness run on all 823 items. Distinct "intermittent_"
  # names: the Phase 2 item_level_* files are completed results, only ever read.
  intermittent_long_filename: intermittent_item_level_backtest_long.csv
  intermittent_fold_summary_filename: intermittent_item_level_fold_summary.csv
  intermittent_per_item_summary_filename: intermittent_item_level_per_item_summary.csv
  intermittent_category_summary_filename: intermittent_item_level_category_macro_avg_summary.csv
  intermittent_state_diagnostics_filename: intermittent_state_diagnostics.csv
  intermittent_zero_reference_filename: intermittent_zero_forecast_reference.csv
  intermittent_all_items_fold_class_filename: intermittent_all_items_fold_class_summary.csv
  intermittent_all_items_class_filename: intermittent_all_items_category_summary.csv
  intermittent_patterns_plot_filename: intermittent_demand_patterns.png
  intermittent_zero_runs_plot_filename: intermittent_zero_run_lengths.png
  intermittent_category_mae_plot_filename: intermittent_category_mae_comparison.png
  intermittent_category_rmse_plot_filename: intermittent_category_rmse_comparison.png
  intermittent_example_forecasts_plot_filename: intermittent_example_forecasts.png
  intermittent_metadata_filename: intermittent_run_metadata.json
  # Notebook 07 -- LSTM / GRU on the AGGREGATE series
  neural_checkpoint_dir: artifacts/models/lstm_gru_checkpoints      # resumable-run checkpoints (git-ignored, safe to delete)
  neural_forecasts_filename: lstm_gru_backtest_forecasts.csv        # model, fold, date, actual, predicted (seed-ensemble mean)
  neural_metrics_filename: lstm_gru_backtest_metrics.csv            # same schema as seasonal_naive_backtest_metrics.csv
  neural_seed_metrics_filename: lstm_gru_seed_metrics.csv           # per-seed MAE/RMSE, to show seed variability
  neural_history_filename: lstm_gru_training_history.csv            # per-epoch train/validation loss
  neural_diagnostics_filename: lstm_gru_fit_diagnostics.csv         # per (model, fold, seed) fit facts
  neural_metadata_filename: lstm_gru_run_metadata.json              # library versions, seeds, config hash
  neural_training_curves_plot_filename: lstm_gru_training_curves.png
  neural_forecast_plot_filename: lstm_gru_forecast_vs_actual.png
  neural_comparison_plot_filename: lstm_gru_vs_classical_mae_rmse.png
  neural_seed_plot_filename: lstm_gru_seed_variability.png
  # Notebook 08 -- Prophet on the AGGREGATE series
  prophet_forecasts_filename: prophet_backtest_forecasts.csv        # model, fold, date, actual, predicted, lower, upper
  prophet_metrics_filename: prophet_backtest_metrics.csv
  prophet_diagnostics_filename: prophet_fit_diagnostics.csv
  prophet_metadata_filename: prophet_run_metadata.json
  prophet_forecast_plot_filename: prophet_forecast_vs_actual.png
  prophet_components_plot_filename: prophet_components.png
  prophet_comparison_plot_filename: prophet_vs_classical_mae_rmse.png
  prophet_interval_plot_filename: prophet_interval_coverage.png
  # Notebook 09 -- unified comparison (every number is recomputed from saved forecasts)
  comparison_aggregate_fold_filename: comparison_aggregate_fold_metrics.csv
  comparison_aggregate_summary_filename: comparison_aggregate_summary.csv
  comparison_item_fold_filename: comparison_item_level_fold_metrics.csv
  comparison_item_class_filename: comparison_item_level_category_summary.csv
  comparison_item_summary_filename: comparison_item_level_model_summary.csv
  comparison_audit_filename: comparison_artifact_audit.csv
  comparison_aggregate_plot_filename: comparison_aggregate_mae_rmse.png
  comparison_aggregate_folds_plot_filename: comparison_aggregate_fold_variation.png
  comparison_item_plot_filename: comparison_item_level_by_category.png
  comparison_item_rmse_plot_filename: comparison_item_level_rmse_by_category.png
  comparison_metadata_filename: comparison_run_metadata.json
  # Notebook 10 -- inventory decision-support demonstration (written to inventory_dir)
  inventory_demo_filename: inventory_demo_reorder_points.csv
  inventory_backtest_filename: inventory_service_level_backtest.csv
  inventory_plot_filename: inventory_service_level_calibration.png
  inventory_backtest_summary_filename: inventory_service_level_backtest_summary.csv
  inventory_sensitivity_filename: inventory_sensitivity.csv
  inventory_worked_example_plot_filename: inventory_worked_example.png
  inventory_sensitivity_plot_filename: inventory_sensitivity.png
  inventory_metadata_filename: inventory_run_metadata.json

# Phase 3 Step 2 -- LSTM / GRU on the AGGREGATE CA_1/FOODS_3 series
# (src/models/lstm_gru.py, notebook 07). Fixed, documented first-baseline
# settings: nothing here is tuned on a fold's forecast window or on the final
# holdout, and no hyper-parameter search is run. The variants are PRE-DECLARED
# here, before any result exists. `calendar` = day-of-week plus the M5 event /
# SNAP / closure flags, all published in advance; `univariate` = the series' own
# past values only (the same information set as the Phase 2 classical models).
neural:
  input_window: 56            # past days fed to the network
  hidden_size: 32
  num_layers: 1
  dropout: 0.1                # applied to the last hidden state before the linear head
  learning_rate: 0.002
  weight_decay: 0.0
  batch_size: 64
  max_epochs: 80
  patience: 10                # early stopping on the inner chronological validation tail
  validation_days: 56         # LAST days of each fold's TRAINING window, held out only for early stopping
  loss: huber                 # huber | mse (on standardised units)
  huber_delta: 1.0
  grad_clip: 1.0
  seeds: [0, 1, 2, 3, 4]      # ensemble members; the reported forecast is their mean
  torch_num_threads: 1        # one thread: results do not depend on the machine's core count
  variants:
    - {cell: lstm, features: calendar}
    - {cell: gru,  features: calendar}
    - {cell: lstm, features: univariate}
    - {cell: gru,  features: univariate}
  primary_features: calendar

# Phase 3 Step 3 -- Prophet on the AGGREGATE series (src/models/prophet_model.py,
# notebook 08). Same rules as above: fixed settings, pre-declared variants, no
# search. Regressors are calendar facts known at the forecast origin (SNAP days,
# M5 event types, the Christmas closure); no future sales ever enter the model.
prophet:
  yearly_seasonality: true
  weekly_seasonality: true
  daily_seasonality: false
  changepoint_prior_scale: 0.05
  seasonality_prior_scale: 10.0
  n_changepoints: 25
  changepoint_range: 0.8
  interval_width: 0.8
  mcmc_samples: 0             # MAP fit (deterministic point forecast); no MCMC
  uncertainty_samples: 1000   # simulation draws behind the interval (Prophet's default)
  random_seed: 42             # seeds the interval simulation; the caller's NumPy random state is restored afterwards
  regressors: [snap_ca, event_cultural, event_national, event_religious, event_sporting, is_christmas]
  variants:
    - {name: "Prophet(additive)", seasonality_mode: additive, use_regressors: true}
    - {name: "Prophet(multiplicative)", seasonality_mode: multiplicative, use_regressors: true}
    - {name: "Prophet(additive,no-regressors)", seasonality_mode: additive, use_regressors: false}
  primary_variant: "Prophet(additive)"

# Phase 3 Step 4 -- unified model comparison (src/evaluation/forecast_artifacts.py,
# src/evaluation/model_comparison.py, notebook 09). The comparison READS these
# saved forecast files; it never re-types a score. AGGREGATE and ITEM-LEVEL files
# are compared separately and their raw errors are never ranked against each other.
comparison:
  mase_seasonal_lag: 7        # MASE scale = in-sample mean |y_t - y_{t-7}| of the fold's training window
  aggregate_forecast_files:   # all in phase2.forecasts_dir; columns model, fold, date, actual, predicted
    - seasonal_naive_backtest_forecasts.csv
    - arima_backtest_forecasts.csv
    - sarima_backtest_forecasts.csv
    - holt_winters_backtest_forecasts.csv
    - lstm_gru_backtest_forecasts.csv
    - prophet_backtest_forecasts.csv
  item_level_forecast_files:  # columns item_id, demand_class, model, fold, date, actual, predicted, success, error
    - item_level_backtest_long.csv
    - xgboost_item_level_backtest_long.csv

# Phase 3 Step 5 -- inventory decision support (src/inventory/). The M5 data contain
# NO lead times, costs, stock levels or service targets, so every operational input
# below is an ILLUSTRATIVE default that the user overrides; none of them came from M5.
inventory:
  default_lead_time_days: 7
  default_review_period_days: 0       # 0 = continuous review
  default_service_level: 0.95         # target cycle service level (probability of no stock-out per cycle)
  min_service_level: 0.50
  max_service_level: 0.999
  max_protection_interval_days: 28    # lead time + review period; limited by the 28-day backtest windows
  min_error_windows_warning: 20       # fewer cumulative-error samples than this triggers a small-sample warning
  bootstrap_resamples: 1000
  bootstrap_seed: 42

# Phase 3 Step 6 -- final-holdout protection (src/evaluation/final_holdout.py).
# Nothing in this section has been executed against the reserved days
# (2016-04-25 .. 2016-05-22). The candidate list is a PROPOSAL until
# `python -m src.evaluation.final_holdout freeze` records it.
final_holdout:
  results_filename: final_holdout_results.csv
  forecasts_filename: final_holdout_forecasts.csv
  frozen_filename: frozen_candidates.json
  record_filename: FINAL_EVALUATION_RECORD.json
  metrics: [MAE, RMSE, MAPE, MASE, WAPE]
  selection_rule: >-
    Every candidate in the frozen list is evaluated once on the reserved 28 days and
    ALL of their results are reported. The headline model is the candidate with the
    lowest mean development-fold MAE (aggregate and item-level compared separately),
    decided from the development folds BEFORE the holdout is touched.
  candidates:
    aggregate: ["SeasonalNaive", "ARIMA", "SARIMA", "HoltWinters", "LSTM(calendar)", "GRU(calendar)", "Prophet(additive)"]
    item_level: ["SeasonalNaive", "Croston", "TSB", "XGBoost(pooled)"]

# Phase 3 Step 7 -- Streamlit dashboard (app/). Display defaults only.
dashboard:
  default_theme: light                # light | dark; the sidebar toggle overrides it for the session
  horizons: [7, 14, 28]               # forecast horizons offered (first h days of the saved 28-day forecasts)
  default_horizon: 28

logging:
  level: INFO
